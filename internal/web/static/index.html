<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gstash · Git Stash Workbench</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">

  <header id="topbar">
    <div class="brand"><span class="mark-block">g</span><span class="mark">gstash</span><span class="tagline">workbench</span></div>
    <div class="branch" id="branch"></div>
    <label class="toggle" title="Filter stashes by current branch"><input type="checkbox" id="filter"> current branch only</label>
    <span class="shortcuts-hint" title="Keyboard shortcuts: J/K or Up/Down to navigate, A to Accept (pop), R to Reject (drop), B to Branch, Tab to toggle filter">j/k nav · a/r/b action</span>
  </header>

  <section id="tablewrap" aria-label="stashes">
    <table id="tbl">
      <thead>
        <tr><th class="c-id">REF</th><th class="c-branch">BRANCH</th><th class="c-age">AGE</th><th class="c-msg">MESSAGE</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="empty hidden">
      <p>No stashes found in this repository.</p>
      <p class="dim">Save changes with <code>gstash save "message"</code> or <code>git stash push -m "message"</code>.</p>
    </div>
  </section>

  <div id="divider" title="Drag to resize panels"></div>

  <section id="detailwrap" aria-label="diff">
    <div id="actionsbar" class="hidden">
      <span id="meta"></span>
      <div class="flex1"></div>
      <div class="btn-group">
        <button id="btnAccept" class="btn accept" title="git stash pop: apply changes to working tree and delete stash">Apply &amp; Pop</button>
        <button id="btnReject" class="btn reject" title="git stash drop: permanently delete this stash without applying">Drop stash</button>
        <button id="btnBranch" class="btn neutral" title="git stash branch: create a new branch from this stash">Create branch</button>
      </div>
    </div>
    <div id="diff-container" class="hidden">
      <pre id="diff"></pre>
    </div>
    <div id="pick" class="placeholder"><span>Select a stash from the table above to inspect its diff.</span></div>
  </section>

  <div id="toast" class="hidden"></div>
</div>
<script src="/app.js"></script>
</body>
</html>
